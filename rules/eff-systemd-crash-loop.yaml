id: "EFF-SYSTEMD-CRASH-LOOP"
name: "Systemd service in failed state"
description: "Evaluates whether service matches target criteria."
category: "efficiency"
severity: "high"
match:
  node_type: "service"
  properties:
      active_state:
        equals: "failed"
consequence: "Service failure disrupts dependent system facilities."
recommendation:
  action: "Check journalctl logs for root failure cause and restart."
  risk_level: "low"
  reversible: true
