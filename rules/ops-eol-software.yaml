id: "OPS-EOL-SOFTWARE"
name: "Operating system distribution or runtime past end-of-life date"
description: "Distribution or runtime version is flagged as EOL in data/eol.yaml dataset."
category: "operations"
severity: "high"
match:
  node_type: "system"
  check_eol: true
consequence: "End-of-life operating systems no longer receive vendor security updates, exposing the host to unpatched CVEs."
recommendation:
  action: "Plan migration and upgrade host to the next supported LTS operating system release."
  risk_level: "high"
  reversible: false

