id: "OPS-STALE-HOSTNAME"
name: "Host not identified as cloud managed"
description: "Evaluates whether system matches target criteria."
category: "operations"
severity: "info"
match:
  node_type: "system"
  properties:
      cloud_provider:
        equals: "none"
consequence: "On-premise or bare metal machines require local backup strategy."
recommendation:
  action: "Maintain automated snapshot or backup policies."
  risk_level: "none"
  reversible: true
