id: "OPS-SERVICE-NO-EXEC"
name: "Service unit missing ExecStart definition"
description: "Evaluates whether service matches target criteria."
category: "operations"
severity: "low"
match:
  node_type: "service"
  properties:
      exec_start:
        equals: ""
consequence: "Incomplete unit definition may fail during reboot."
recommendation:
  action: "Verify unit configuration file syntax."
  risk_level: "low"
  reversible: true
