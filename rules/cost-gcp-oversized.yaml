id: "COST-GCP-OVERSIZED"
name: "GCP cloud compute instance active"
description: "Evaluates whether system matches target criteria."
category: "cost"
severity: "info"
match:
  node_type: "system"
  properties:
      cloud_provider:
        equals: "gcp"
consequence: "Cloud instances should be monitored for sustained cost efficiency."
recommendation:
  action: "Check GCP right-sizing recommendations in console."
  risk_level: "low"
  reversible: true
