id: "SEC-USER-ROOT-PORT"
name: "Process running as root user"
description: "Evaluates whether process matches target criteria."
category: "security"
severity: "medium"
match:
  node_type: "process"
  properties:
      uid:
        equals: 0
consequence: "Processes running as UID 0 have unbounded host privileges if compromised."
recommendation:
  action: "Run service under dedicated unprivileged system user."
  risk_level: "medium"
  reversible: true
