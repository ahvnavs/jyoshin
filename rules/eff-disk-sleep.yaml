id: "EFF-DISK-SLEEP"
name: "Process blocked in uninterruptible disk I/O sleep"
description: "Evaluates whether process matches target criteria."
category: "efficiency"
severity: "high"
match:
  node_type: "process"
  properties:
      state:
        equals: "D"
consequence: "Uninterruptible sleep indicates storage I/O bottleneck or hung filesystem."
recommendation:
  action: "Check storage device health and IOPS latency."
  risk_level: "low"
  reversible: true
