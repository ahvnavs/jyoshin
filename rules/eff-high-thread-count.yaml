id: "EFF-HIGH-THREAD-COUNT"
name: "Process spawned large thread pool (>200 threads)"
description: "Evaluates whether process matches target criteria."
category: "efficiency"
severity: "low"
match:
  node_type: "process"
  properties:
      threads:
        greater_than: 200
consequence: "Excessive threads cause kernel context switching overhead."
recommendation:
  action: "Tune thread worker pool size to available CPU cores."
  risk_level: "low"
  reversible: true
