id: "SEC-DB-MONGO-EXPOSED"
name: "MongoDB database listening publicly"
description: "Evaluates whether port matches target criteria."
category: "security"
severity: "critical"
match:
  node_type: "port"
  properties:
      local_port:
        equals: 27017
      exposure_class:
        equals: "all_interfaces"
consequence: "Public database port invites automated ransom attacks and data theft."
recommendation:
  action: "Bind mongod to loopback or VPC private CIDR."
  risk_level: "medium"
  reversible: true
