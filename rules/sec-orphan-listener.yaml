id: "SEC-ORPHAN-LISTENER"
name: "Unmanaged manual binary with active listening port"
description: "Listening port backed by an executable installed manually without package management."
category: "security"
severity: "high"
match:
  node_type: "port"
  properties:
    exposure_class:
      equals: "all_interfaces"
  join:
    relation: "listens_on"
    direction: "in"
    node_type: "process"
    properties:
      exe:
        contains: "/usr/local"
consequence: "Unmanaged network listeners lack automatic operating system security updates and vulnerability patches."
recommendation:
  action: "Package daemon via deb/rpm or migrate execution to container with version pinning."
  risk_level: "medium"
  reversible: true

