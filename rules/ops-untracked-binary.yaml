id: "OPS-UNTRACKED-BINARY"
name: "Third-party software executing from /opt hierarchy"
description: "Evaluates whether process matches target criteria."
category: "operations"
severity: "medium"
match:
  node_type: "process"
  properties:
      exe:
        contains: "/opt"
consequence: "Software installed in /opt requires manual patch updates."
recommendation:
  action: "Document software vendor and schedule recurring updates."
  risk_level: "low"
  reversible: true
