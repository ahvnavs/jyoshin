id: "COST-SWAP-MISFIT"
name: "Zero swap space configured on virtual host"
description: "Evaluates whether system matches target criteria."
category: "cost"
severity: "low"
match:
  node_type: "system"
  properties:
      swap_bytes:
        equals: 0
consequence: "Zero swap increases risk of sudden OOM-killer termination under spikes."
recommendation:
  action: "Create bounded zram or file-backed swap partition."
  risk_level: "low"
  reversible: true
