id: "EFF-MULTI-PROC-NGINX"
name: "Nginx master process active"
description: "Evaluates whether process matches target criteria."
category: "efficiency"
severity: "info"
match:
  node_type: "process"
  properties:
      name:
        equals: "nginx"
consequence: "Ensure worker count matches system CPU core layout."
recommendation:
  action: "Set worker_processes auto in nginx.conf."
  risk_level: "low"
  reversible: true
