id: "COST-HEAVY-PROCESS"
name: "Process reserving large virtual memory space (>10GB)"
description: "Evaluates whether process matches target criteria."
category: "cost"
severity: "medium"
match:
  node_type: "process"
  properties:
      vsize:
        greater_than: 10737418240
consequence: "High memory consumers drive up cluster capacity requirements."
recommendation:
  action: "Profile process heap and tune garbage collection thresholds."
  risk_level: "medium"
  reversible: true
