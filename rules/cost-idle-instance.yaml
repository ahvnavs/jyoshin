id: "COST-IDLE-INSTANCE"
name: "Virtual machine instance under low utilization"
description: "Evaluates whether system matches target criteria."
category: "cost"
severity: "medium"
match:
  node_type: "system"
  properties:
      virtualization:
        equals: "kvm"
consequence: "Sustained under-utilized VM wastes cloud infrastructure budget."
recommendation:
  action: "Right-size instance to a smaller tier during scheduled maintenance."
  risk_level: "low"
  reversible: true
