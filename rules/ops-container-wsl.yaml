id: "OPS-CONTAINER-WSL"
name: "Host running on WSL2 virtual environment"
description: "Evaluates whether system matches target criteria."
category: "operations"
severity: "info"
match:
  node_type: "system"
  properties:
      virtualization:
        equals: "wsl"
consequence: "WSL kernel has slight operational differences from bare-metal Linux."
recommendation:
  action: "Verify compatibility with native production targets."
  risk_level: "none"
  reversible: true
