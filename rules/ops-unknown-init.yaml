id: "OPS-UNKNOWN-INIT"
name: "Service unit in unverified state"
description: "Evaluates whether service matches target criteria."
category: "operations"
severity: "medium"
match:
  node_type: "service"
  properties:
      active_state:
        equals: "unknown"
consequence: "Unmonitored service states leave operational blind spots."
recommendation:
  action: "Inspect service status via systemctl status."
  risk_level: "low"
  reversible: true
