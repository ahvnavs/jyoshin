id: "EFF-HIGH-FD-COUNT"
name: "Process holding high open file descriptor count"
description: "Evaluates whether process matches target criteria."
category: "efficiency"
severity: "high"
match:
  node_type: "process"
  properties:
      open_fds:
        greater_than: 500
consequence: "FD accumulation may indicate file or socket leak."
recommendation:
  action: "Inspect open file descriptors via lsof and audit connection closing."
  risk_level: "medium"
  reversible: true
