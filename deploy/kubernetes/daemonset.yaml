apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kazeshini-node-inspector
  namespace: kazeshini-system
  labels:
    app.kubernetes.io/name: kazeshini
    app.kubernetes.io/component: node-inspector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kazeshini
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kazeshini
    spec:
      # hostPID is required if full host process tree inspection is desired.
      # When omitted in restricted environments, Kazeshini operates with reduced process visibility.
      hostPID: true
      hostNetwork: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kazeshini
          image: kazeshini:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - "serve"
            - "--addr=0.0.0.0:8080"
            - "--root=/host"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: host-etc
              mountPath: /host/etc
              readOnly: true
            - name: host-var-log
              mountPath: /host/var/log
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-sys
          hostPath:
            path: /sys
        - name: host-etc
          hostPath:
            path: /etc
        - name: host-var-log
          hostPath:
            path: /var/log
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-app-with-sidecar
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: example-app
  template:
    metadata:
      labels:
        app: example-app
    spec:
      containers:
        - name: app
          image: nginx:alpine
          ports:
            - containerPort: 80
        # Minimal privilege sidecar variant (no hostPID, no host mount)
        - name: kazeshini-sidecar
          image: kazeshini:v0.1.0
          args:
            - "serve"
            - "--addr=127.0.0.1:8080"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 50m
              memory: 64Mi

