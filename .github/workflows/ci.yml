name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          check-latest: true

      - name: Verify Formatting (gofmt)
        run: make fmt-check

      - name: Go Vet
        run: make vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Tests with Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          check-latest: true

      - name: Run Tests (-race)
        run: make test

  build:
    name: Cross-Compile Static Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          check-latest: true

      - name: Build All (amd64 + arm64)
        run: make build-all

      - name: Verify Static Linking
        run: |
          file dist/kazeshini-linux-amd64
          file dist/kazeshini-linux-arm64

  smoke:
    name: End-to-End Smoke Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          check-latest: true

      - name: Run Smoke Suite
        run: bash scripts/smoke.sh

