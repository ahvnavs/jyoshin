name: CI Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-matrix:
    name: Container Matrix (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:24.04
          - distro: debian
            image: debian:12
          - distro: fedora
            image: fedora:40
          - distro: alpine
            image: alpine:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
          check-latest: true

      - name: Build Static Binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -buildid=" -o kazeshini ./cmd/kazeshini

      - name: Smoke Test in Distro Container
        run: |
          docker run --rm -v "$(pwd)/kazeshini:/bin/kazeshini:ro" ${{ matrix.image }} /bin/kazeshini --version --verbose
          docker run --rm -v "$(pwd)/kazeshini:/bin/kazeshini:ro" ${{ matrix.image }} /bin/kazeshini --once --json

