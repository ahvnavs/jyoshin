name: CI Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-matrix:
    name: Container Matrix (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:24.04
          - distro: debian
            image: debian:12
          - distro: fedora
            image: fedora:40
          - distro: alpine
            image: alpine:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.24'
          check-latest: true

      - name: Build Static Binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -buildid=" -o kazeshini ./cmd/kazeshini

      - name: Smoke Test in Distro Container
        run: |
          docker run --rm -v "$(pwd)/kazeshini:/bin/kazeshini:ro" ${{ matrix.image }} /bin/kazeshini --version --verbose
          docker run --rm -v "$(pwd)/kazeshini:/bin/kazeshini:ro" ${{ matrix.image }} /bin/kazeshini --once --json

