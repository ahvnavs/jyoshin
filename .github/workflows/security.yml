name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1' # Weekly on Monday

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: '1.24'
          check-latest: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@b029981e3739c71212d249821fca9736f1638640 # v1.0.4

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@48ab28a6f5dab2a823e7e60048e490290ee1abb8 # v3.28.0
        with:
          languages: go

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@48ab28a6f5dab2a823e7e60048e490290ee1abb8 # v3.28.0

