# NFPM configuration for Jyōshin (.deb and .rpm packaging)
name: "jyoshin"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "admin"
priority: "optional"
maintainer: "Jyōshin Authors <maintainers@jyoshin.dev>"
description: "Server Truth Engine for Linux: Read-only, local-first inspection engine"
vendor: "Jyōshin"
homepage: "https://github.com/OWNER/jyoshin"
license: "Apache-2.0"

contents:
  - src: ./jyoshin
    dst: /usr/local/bin/jyoshin
    file_info:
      mode: 0755
  - src: ./packaging/systemd/jyoshin.service
    dst: /etc/systemd/system/jyoshin.service
    file_info:
      mode: 0644
  - src: ./packaging/config/jyoshin.json
    dst: /etc/jyoshin/jyoshin.json
    type: config|noreplace
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh

deb:
  compression: xz

rpm:
  compression: lzma

