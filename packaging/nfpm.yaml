# NFPM configuration for Kazeshini (.deb and .rpm packaging)
name: "kazeshini"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
section: "admin"
priority: "optional"
maintainer: "Kazeshini Authors <maintainers@kazeshini.dev>"
description: "Server Truth Engine for Linux: Read-only, local-first inspection engine"
vendor: "Kazeshini"
homepage: "https://github.com/OWNER/kazeshini"
license: "Apache-2.0"

contents:
  - src: ./kazeshini
    dst: /usr/local/bin/kazeshini
    file_info:
      mode: 0755
  - src: ./packaging/systemd/kazeshini.service
    dst: /etc/systemd/system/kazeshini.service
    file_info:
      mode: 0644
  - src: ./packaging/config/kazeshini.json
    dst: /etc/kazeshini/kazeshini.json
    type: config|noreplace
    file_info:
      mode: 0644

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh

deb:
  compression: xz

rpm:
  compression: lzma

