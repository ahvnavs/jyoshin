apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kazeshini.fullname" . }}
  labels:
    app.kubernetes.io/name: kazeshini
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: kazeshini
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kazeshini
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kazeshini
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 7777
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

